# Build ROS 1 Noetic and Gazebo Classic for Ubuntu 24.04 on amd64 and arm64.
# Focal calls the upstream metapackage ros-noetic-desktop-full. Noble does not publish it.
# Noetic's package list does not compile against Gazebo, so the two builds run together.
# This workflow is started by hand. Cloning the noetic branch and running ./bootstrap.sh stays separate.
name: Noetic on Ubuntu 24.04

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Run id whose Noetic and Gazebo prefixes to package. Empty compiles them.
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

defaults:
  run:
    # ubuntu:24.04 jobs default to sh. pipefail is a bash option.
    shell: bash

jobs:
  ros:
    name: noetic-${{ matrix.arch }}
    if: inputs.reuse_run_id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the tools needed to fetch this repo
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git sudo python3
      - name: Check out the Noetic branch
        run: git clone --branch noetic --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" tree
      - name: Build Noetic into /opt/ros/noetic
        run: |
          set -euo pipefail
          id builder >/dev/null 2>&1 || useradd --create-home --shell /bin/bash builder
          printf '%s\n' 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE/tree"
          sudo -u builder env HOME=/home/builder ROS_BUILD_JOBS=4 XGC2_SKIP_GAZEBO=1 \
            bash --noprofile --norc -c 'cd "$1" && exec ./bootstrap.sh' \
            bash "$GITHUB_WORKSPACE/tree"
      - name: Pack the Noetic prefix
        run: |
          set -euo pipefail
          rm -rf \
            "$GITHUB_WORKSPACE/tree/src" \
            "$GITHUB_WORKSPACE/tree/build" \
            "$GITHUB_WORKSPACE/tree/build_isolated" \
            "$GITHUB_WORKSPACE/tree/devel_isolated" \
            "$GITHUB_WORKSPACE/tree/.venv"
          tar -C /opt/ros/noetic -czf "$GITHUB_WORKSPACE/ros-noetic.tar.gz" .
      - name: Upload the Noetic prefix
        uses: actions/upload-artifact@v4
        with:
          name: ros-prefix-${{ matrix.arch }}
          path: ros-noetic.tar.gz
          if-no-files-found: error

  gazebo:
    name: gazebo-${{ matrix.arch }}
    if: inputs.reuse_run_id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the tools needed to fetch this repo
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git sudo python3
      - name: Check out Gazebo Classic
        run: |
          set -euo pipefail
          git clone --branch noetic --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" tree
          git -C tree submodule update --init --depth 1 gazebo
      - name: Build Gazebo Classic into /opt/ros/noetic/opt/gazebo
        run: |
          set -euo pipefail
          id builder >/dev/null 2>&1 || useradd --create-home --shell /bin/bash builder
          printf '%s\n' 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          mkdir -p /opt/ros/noetic/opt/gazebo
          chown -R builder:builder "$GITHUB_WORKSPACE/tree" /opt/ros/noetic
          sudo -u builder env HOME=/home/builder GAZEBO_BUILD_JOBS=4 \
            XGC2_GAZEBO_PREFIX=/opt/ros/noetic/opt/gazebo \
            bash --noprofile --norc -c 'cd "$1" && exec ./bootstrap.sh' \
            bash "$GITHUB_WORKSPACE/tree/gazebo"
      - name: Pack the Gazebo prefix
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/tree/gazebo/gazebo"
          tar -C /opt/ros/noetic/opt/gazebo -czf "$GITHUB_WORKSPACE/gazebo.tar.gz" .
      - name: Upload the Gazebo prefix
        uses: actions/upload-artifact@v4
        with:
          name: gazebo-prefix-${{ matrix.arch }}
          path: gazebo.tar.gz
          if-no-files-found: error

  package:
    name: package-${{ matrix.arch }}
    needs: [ros, gazebo]
    if: >-
      always() &&
      (needs.ros.result == 'success' || needs.ros.result == 'skipped') &&
      (needs.gazebo.result == 'success' || needs.gazebo.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packaging tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git sudo python3 dpkg-dev
      - name: Check out the packaging scripts
        run: |
          set -euo pipefail
          git clone --branch noetic --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" tree
          git -C tree submodule update --init --depth 1 gazebo
      # dpkg-shlibdeps exits before writing Depends when a SONAME is absent.
      - name: Install host libraries so shlibdeps can name them
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(
            awk '{ sub(/#.*/, ""); if (NF) print $1 }' \
              tree/apt-host.txt tree/gazebo/apt-host.txt | sort -u
          )
          apt-get update
          apt-get install -y --no-install-recommends "${pkgs[@]}"
      - name: Download the Noetic prefix
        if: inputs.reuse_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: ros-prefix-${{ matrix.arch }}
          path: incoming/ros
      - name: Download the Gazebo prefix
        if: inputs.reuse_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: gazebo-prefix-${{ matrix.arch }}
          path: incoming/gazebo
      - name: Download prefixes from an earlier run
        if: inputs.reuse_run_id != ''
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import io
          import json
          import os
          import pathlib
          import urllib.request
          import zipfile

          class DropAuthOnRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  new = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if new is not None:
                      new.remove_header("Authorization")
                  return new

          opener = urllib.request.build_opener(DropAuthOnRedirect)
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["REUSE_RUN_ID"]
          arch = os.environ["ARCH"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          want = {
              f"ros-prefix-{arch}": pathlib.Path("incoming/ros"),
              f"gazebo-prefix-{arch}": pathlib.Path("incoming/gazebo"),
          }
          list_url = (
              f"https://api.github.com/repos/{repo}/actions/runs/{run}/artifacts?per_page=100"
          )
          with opener.open(urllib.request.Request(list_url, headers=headers)) as resp:
              artifacts = json.load(resp)["artifacts"]
          found = {item["name"]: item for item in artifacts}
          missing = [name for name in want if name not in found]
          if missing:
              raise SystemExit("missing artifacts: " + ", ".join(missing))
          for name, dest in want.items():
              dest.mkdir(parents=True, exist_ok=True)
              url = found[name]["archive_download_url"]
              with opener.open(urllib.request.Request(url, headers=headers)) as resp:
                  payload = resp.read()
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  archive.extractall(dest)
              print(f"extracted {name} into {dest}")
          PY
      - name: Package xgc2-ros-noetic
        run: |
          set -euo pipefail
          id builder >/dev/null 2>&1 || useradd --create-home --shell /bin/bash builder
          mkdir -p /opt/ros/noetic/opt/gazebo
          tar -C /opt/ros/noetic -xzf incoming/ros/ros-noetic.tar.gz
          tar -C /opt/ros/noetic/opt/gazebo -xzf incoming/gazebo/gazebo.tar.gz
          chown -R builder:builder /opt/ros/noetic "$GITHUB_WORKSPACE/tree"
          sudo -u builder env \
            HOME=/home/builder \
            XGC2_DEB_VERSION="1.0.0+noble.${GITHUB_RUN_NUMBER}" \
            bash --noprofile --norc -c 'cd "$1" && exec ./scripts/package-deb.sh' \
            bash "$GITHUB_WORKSPACE/tree"
      - name: Upload the deb
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-ros-noetic-${{ matrix.arch }}
          path: tree/dist/*.deb
          if-no-files-found: error

  release:
    name: Publish both debs
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          pattern: xgc2-ros-noetic-*
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Ubuntu 20.04 上同角色的官方包是 `ros-noetic-desktop-full`。Ubuntu 24.04 没有这个包。' \
            '' \
            '这两个 deb 由干净的 Ubuntu 24.04 amd64 和 arm64 runner 并行编译 Noetic 和 Gazebo Classic 而来。Noetic 在 `/opt/ros/noetic`。Gazebo Classic 在 `/opt/ros/noetic/opt/gazebo`，不安装到 `/usr`。' \
            '' \
            '```bash' \
            'sudo apt install ./xgc2-ros-noetic_*_$(dpkg --print-architecture).deb' \
            'source /opt/ros/noetic/setup.bash' \
            '```' \
            '' \
            '不要把 source 写进 shell 启动文件。本地克隆 `noetic` 分支后运行 `./bootstrap.sh` 仍然可以。' \
            > notes.md
          tag="noetic-noble-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.deb --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/*.deb \
              --repo "$GITHUB_REPOSITORY" \
              --title "Noetic for Ubuntu 24.04 (${GITHUB_RUN_NUMBER})" \
              --notes-file notes.md
          fi
